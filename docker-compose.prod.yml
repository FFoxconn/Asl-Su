services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aslsu-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    volumes:
      - aslsu-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/src/AslSu.Api/Dockerfile
    container_name: aslsu-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Server=sqlserver;Database=AslSu;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      TrendyolGo__SupplierId: "${TRENDYOL_SUPPLIER_ID:-}"
      TrendyolGo__ApiKey: "${TRENDYOL_API_KEY:-}"
      TrendyolGo__ApiSecret: "${TRENDYOL_API_SECRET:-}"
      TrendyolGo__BaseUrl: "${TRENDYOL_BASE_URL:-}"
      TrendyolGo__AgentName: "${TRENDYOL_AGENT_NAME:-}"
      TrendyolGo__ExecutorUser: "${TRENDYOL_EXECUTOR_USER:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: aslsu-web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  aslsu-sqlserver-data:
